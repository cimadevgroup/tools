<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMA Architect 2.0 - Editor Universal JS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --primary: #38bdf8;
            --accent: #818cf8;
            --text-light: #f1f5f9;
            --text-gray: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: var(--bg-dark); color: var(--text-light);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* HEADER */
        header {
            height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
        }
        .brand { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--primary); font-size: 1.5rem; }
        
        .toolbar { display: flex; gap: 10px; }
        .btn {
            background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-light);
            padding: 8px 15px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: 0.2s; font-size: 0.9rem;
        }
        .btn:hover { background: var(--border); }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: #000; font-weight: 600; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-success { background: var(--success); border-color: var(--success); color: white; font-weight: 600; }
        .btn-success:hover { background: #16a34a; }

        /* MAIN LAYOUT */
        main { display: flex; flex: 1; overflow: hidden; }

        /* SIDEBAR */
        .sidebar {
            width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .sidebar-head { padding: 15px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-gray); letter-spacing: 1px; }
        .block-list { flex: 1; overflow-y: auto; }
        .block-item {
            padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
        }
        .block-item:hover { background: rgba(255,255,255,0.05); }
        .block-item.active { background: rgba(56, 189, 248, 0.15); border-left: 3px solid var(--primary); color: var(--primary); }

        /* CANVAS AREA */
        .workspace { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        
        .canvas-toolbar {
            height: 40px; background: rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 20px; gap: 15px; border-bottom: 1px solid var(--border);
        }
        .canvas-info { font-size: 0.85rem; color: var(--text-gray); }

        .canvas-viewport {
            flex: 1; overflow: auto; padding: 40px; display: flex; justify-content: center; align-items: flex-start;
            background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px;
        }

        .preview-container {
            background: white; color: #333; width: 100%; max-width: 900px; min-height: 400px;
            border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            padding: 20px; position: relative;
        }

        /* EDITABLE ELEMENTS */
        [data-editable="true"] {
            outline: 1px dashed transparent; cursor: pointer; transition: 0.1s;
        }
        [data-editable="true"]:hover { outline: 1px dashed var(--primary); }
        [data-editable="true"].selected { outline: 2px solid var(--primary); background: rgba(56, 189, 248, 0.1); }

        /* PROPERTIES PANEL */
        .props-panel {
            width: 300px; background: var(--bg-panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .props-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 0.9rem; }
        .props-body { flex: 1; overflow-y: auto; padding: 15px; }
        
        .prop-group { margin-bottom: 15px; }
        .prop-label { display: block; font-size: 0.75rem; color: var(--text-gray); margin-bottom: 5px; text-transform: uppercase; }
        .prop-input {
            width: 100%; background: #0f172a; border: 1px solid var(--border); color: white;
            padding: 8px; border-radius: 4px; font-size: 0.9rem;
        }
        .prop-input:focus { border-color: var(--primary); }

        .tag-badge {
            background: var(--border); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; color: var(--accent);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal { background: var(--bg-panel); padding: 25px; border-radius: 8px; width: 500px; border: 1px solid var(--border); }
        .modal h3 { margin-top: 0; }
        textarea.code-preview {
            width: 100%; height: 200px; background: #000; color: #0f0; font-family: monospace; padding: 10px; border: 1px solid var(--border);
        }

    </style>
</head>
<body>

<header>
    <div class="brand">
        <i class="bi bi-layers-half"></i> CIMA Architect <span style="font-size:0.8em; opacity:0.6; font-weight:normal;">v2.0</span>
    </div>
    <div class="toolbar">
        <input type="file" id="fileInput" accept=".js" style="display: none;" onchange="loadFile(this)">
        <button class="btn" onclick="document.getElementById('fileInput').click()">
            <i class="bi bi-folder2-open"></i> Cargar drawers.js
        </button>
        <button class="btn btn-primary" onclick="exportFile()" disabled id="btnExport">
            <i class="bi bi-download"></i> Exportar
        </button>
    </div>
</header>

<main>
    <!-- SIDEBAR: Bloques detectados -->
    <div class="sidebar">
        <div class="sidebar-head">Componentes Detectados</div>
        <div class="block-list" id="blockList">
            <div style="padding:20px; color:var(--text-gray); text-align:center; font-size:0.85rem;">
                Sube un archivo .js para escanear bloques HTML.
            </div>
        </div>
    </div>

    <!-- CANVAS -->
    <div class="workspace">
        <div class="canvas-toolbar">
            <span class="canvas-info" id="currentBlockName">Ningún bloque seleccionado</span>
            <div style="flex:1"></div>
            <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="moveSelected('up')"><i class="bi bi-arrow-up"></i></button>
            <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="moveSelected('down')"><i class="bi bi-arrow-down"></i></button>
            <button class="btn" style="padding: 4px 10px; font-size: 0.8rem; color: #ef4444;" onclick="deleteSelected()"><i class="bi bi-trash"></i></button>
        </div>
        <div class="canvas-viewport">
            <div id="previewContainer" class="preview-container">
                <div style="text-align:center; color:#999; margin-top:50px;">
                    <i class="bi bi-code-slash" style="font-size:3rem;"></i>
                    <p>Esperando archivo...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- PROPERTIES -->
    <div class="props-panel" id="propsPanel">
        <div class="props-header">Propiedades</div>
        <div class="props-body" id="propsContent">
            <div style="text-align:center; color:var(--text-gray); margin-top:50px; font-size:0.9rem;">
                Selecciona un elemento en el canvas para editar.
            </div>
        </div>
    </div>
</main>

<script>
    // --- ESTADO GLOBAL ---
    let originalFileContent = "";
    let detectedBlocks = []; // { id, name, type, originalCode, startIdx, endIdx }
    let currentBlockId = null;
    let selectedElement = null;

    // --- PARSERS (Expresiones Regulares para encontrar bloques HTML en JS) ---
    // Intenta encontrar estructuras comunes en el archivo del usuario
    const parsers = [
        {
            name: "Login Drawer",
            regex: /const\s+loginHTML\s*=\s*`([\s\S]*?)`(?:\s*;)/,
            type: "variable"
        },
        {
            name: "Search Drawer",
            regex: /const\s+searchHTML\s*=\s*`([\s\S]*?)`(?:\s*;)/,
            type: "variable"
        },
        {
            name: "Config Form (renderSharedForm)",
            // Busca la función renderSharedForm y su return
            regex: /renderSharedForm\s*\([^)]*\)\s*{[\s\S]*?return\s*`([\s\S]*?)`;/,
            type: "function"
        },
        {
            name: "Export Drawer",
            // Busca dentro de Export.open la asignación a innerHTML
            regex: /Export:\s*{[\s\S]*?open\s*\(\)[\s\S]*?el\.innerHTML\s*=\s*`([\s\S]*?)`/,
            type: "method"
        },
        {
            name: "User Creator (inline)",
            regex: /UserCreator:\s*{[\s\S]*?open\s*\(\)[\s\S]*?el\.innerHTML\s*=\s*`([\s\S]*?)`/,
            type: "method"
        }
    ];

    // --- CARGA DE ARCHIVO ---
    function loadFile(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            originalFileContent = e.target.result;
            scanFile();
            document.getElementById('btnExport').disabled = false;
            document.getElementById('fileInput').style.display = 'none'; // Ocultar input para limpiar UI
        };
        reader.readAsText(file);
    }

    // --- ESCANEO DEL ARCHIVO ---
    function scanFile() {
        detectedBlocks = [];
        const list = document.getElementById('blockList');
        list.innerHTML = "";

        // Ejecutar todos los parsers
        parsers.forEach(parser => {
            const match = originalFileContent.match(parser.regex);
            if (match) {
                const blockId = 'block_' + Math.random().toString(36).substr(2, 9);
                const htmlContent = match[1]; // El contenido dentro de los backticks
                
                detectedBlocks.push({
                    id: blockId,
                    name: parser.name,
                    originalContent: htmlContent,
                    currentContent: htmlContent, // Contenido modificado
                    type: parser.type,
                    fullMatch: match[0] // Para reemplazar exacto al exportar
                });

                // Añadir a la lista lateral
                const item = document.createElement('div');
                item.className = 'block-item';
                item.innerHTML = `<i class="bi bi-file-code"></i> ${parser.name}`;
                item.onclick = () => selectBlock(blockId);
                list.appendChild(item);
            }
        });

        if (detectedBlocks.length === 0) {
            alert("No se detectaron bloques HTML estándar en el archivo. Asegúrate de que contiene variables como 'loginHTML = `...`' o la función 'renderSharedForm'.");
        }
    }

    // --- SELECCIÓN DE BLOQUE ---
    function selectBlock(blockId) {
        currentBlockId = blockId;
        selectedElement = null;
        renderProperties(null);

        // Actualizar UI sidebar
        document.querySelectorAll('.block-item').forEach(el => el.classList.remove('active'));
        // (Simplificación visual, idealmente buscaríamos por ID pero basta con re-renderizar si fuera necesario)

        const block = detectedBlocks.find(b => b.id === blockId);
        document.getElementById('currentBlockName').innerText = block.name;

        // Renderizar en Canvas
        const container = document.getElementById('previewContainer');
        
        // Limpiamos el contenido previo pero mantenemos estilos base del container
        // Nota: Inyectamos el HTML tal cual. El navegador interpretará los tags.
        container.innerHTML = block.currentContent;

        // Hacer elementos editables recursivamente
        makeEditable(container);

        // Restaurar selección visual en sidebar (hack simple por iteración)
        const items = document.querySelectorAll('.block-item');
        const idx = detectedBlocks.indexOf(block);
        if(idx >=0) items[idx].classList.add('active');
    }

    // --- HACER EDITABLE (Interacción) ---
    function makeEditable(root) {
        const all = root.querySelectorAll('*');
        all.forEach(el => {
            // Evitamos editar el contenedor raíz o elementos sin sentido
            if (el === root) return;
            
            // Atributo data para marcarlo
            el.setAttribute('data-editable', 'true');
            
            // Evento click
            el.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                selectElement(el);
            };
        });
    }

    // --- SELECCIÓN DE ELEMENTO ---
    function selectElement(el) {
        // Quitar selección previa
        if (selectedElement) selectedElement.classList.remove('selected');
        
        selectedElement = el;
        el.classList.add('selected');

        renderProperties(el);
    }

    // --- PANEL DE PROPIEDADES ---
    function renderProperties(el) {
        const panel = document.getElementById('propsContent');
        if (!el) {
            panel.innerHTML = `<div style="text-align:center; color:var(--text-gray); margin-top:50px;">Selecciona un elemento.</div>`;
            return;
        }

        const tagName = el.tagName.toLowerCase();
        const id = el.id || "";
        const className = el.className || "";
        const placeholder = el.getAttribute('placeholder') || "";
        const type = el.getAttribute('type') || (tagName === 'input' ? 'text' : '');
        const innerText = el.innerText.trim(); // Cuidado con elementos anidados
        
        // Detectar si es input, select, button o div
        let html = `
            <div class="prop-group">
                <span class="tag-badge">${tagName}</span>
            </div>
            
            <div class="prop-group">
                <label class="prop-label">ID</label>
                <input type="text" class="prop-input" value="${id}" onchange="updateAttr('id', this.value)">
            </div>

            <div class="prop-group">
                <label class="prop-label">Clases (CSS)</label>
                <input type="text" class="prop-input" value="${className}" onchange="updateAttr('className', this.value)">
                <small style="color:#64748b; font-size:0.7rem;">Separa con espacios. Ej: span-2 form-input</small>
            </div>
        `;

        if (tagName === 'input' || tagName === 'textarea') {
            html += `
                <div class="prop-group">
                    <label class="prop-label">Tipo (Type)</label>
                    <select class="prop-input" onchange="updateAttr('type', this.value)">
                        <option value="text" ${type==='text'?'selected':''}>Text</option>
                        <option value="password" ${type==='password'?'selected':''}>Password</option>
                        <option value="number" ${type==='number'?'selected':''}>Number</option>
                        <option value="email" ${type==='email'?'selected':''}>Email</option>
                        <option value="date" ${type==='date'?'selected':''}>Date</option>
                        <option value="hidden" ${type==='hidden'?'selected':''}>Hidden</option>
                    </select>
                </div>
                <div class="prop-group">
                    <label class="prop-label">Placeholder</label>
                    <input type="text" class="prop-input" value="${placeholder}" onchange="updateAttr('placeholder', this.value)">
                </div>
                <div class="prop-group">
                    <label class="prop-label">Valor / Defecto</label>
                    <input type="text" class="prop-input" value="${el.value || ''}" onchange="updateAttr('value', this.value)">
                </div>
            `;
        } else if (tagName === 'select') {
            html += `
                <div class="prop-group">
                    <label class="prop-label">Opciones (HTML)</label>
                    <textarea class="prop-input" rows="4" onchange="updateInner(this.value)">${el.innerHTML}</textarea>
                    <small style="color:#ef4444; font-size:0.7rem;">Edita el HTML interno de las opciones</small>
                </div>
            `;
        } else {
             // Para divs, labels, buttons, etc.
             // Solo permitimos editar texto si no tiene hijos complejos
             const hasComplexChildren = el.children.length > 0 && el.querySelector('input, select, div');
             if (!hasComplexChildren) {
                 html += `
                 <div class="prop-group">
                    <label class="prop-label">Texto Interno</label>
                    <input type="text" class="prop-input" value="${innerText}" onchange="updateText(this.value)">
                </div>`;
             } else {
                 html += `<div class="prop-group"><small class="text-gray">Elemento complejo, editar texto directamente en vista.</small></div>`;
             }
        }

        // Estilos inline genéricos
        html += `
            <div class="prop-group">
                <label class="prop-label">Estilo (Inline CSS)</label>
                <input type="text" class="prop-input" value="${el.style.cssText || ''}" placeholder="width:100%; color:red" onchange="updateStyle(this.value)">
            </div>
        `;

        panel.innerHTML = html;
    }

    // --- ACTUALIZACIONES DEL DOM ---
    function updateAttr(key, value) {
        if (!selectedElement) return;
        if (key === 'className') {
            selectedElement.className = value;
        } else {
            selectedElement.setAttribute(key, value);
        }
        saveCurrentBlockState();
    }

    function updateText(value) {
        if (!selectedElement) return;
        selectedElement.innerText = value;
        saveCurrentBlockState();
    }

    function updateInner(html) {
        if (!selectedElement) return;
        selectedElement.innerHTML = html;
        saveCurrentBlockState();
    }

    function updateStyle(css) {
        if (!selectedElement) return;
        selectedElement.style.cssText = css;
        saveCurrentBlockState();
    }

    // --- ACCIONES DE ELEMENTO (Mover/Borrar) ---
    function moveSelected(direction) {
        if (!selectedElement) return;
        const parent = selectedElement.parentNode;
        if (direction === 'up') {
            if (selectedElement.previousElementSibling) {
                parent.insertBefore(selectedElement, selectedElement.previousElementSibling);
            }
        } else {
            if (selectedElement.nextElementSibling) {
                parent.insertBefore(selectedElement.nextElementSibling, selectedElement);
            }
        }
        saveCurrentBlockState();
    }

    function deleteSelected() {
        if (!selectedElement) return;
        if (!confirm("¿Borrar este elemento?")) return;
        selectedElement.remove();
        selectedElement = null;
        renderProperties(null);
        saveCurrentBlockState();
    }

    // --- GUARDADO DE ESTADO DEL BLOQUE ---
    function saveCurrentBlockState() {
        if (!currentBlockId) return;
        
        // Serializamos el HTML del contenedor
        const container = document.getElementById('previewContainer');
        // Limpiamos atributos temporales del editor antes de guardar
        cleanEditable(container);
        
        const newHTML = container.innerHTML;
        
        // Actualizar en memoria
        const block = detectedBlocks.find(b => b.id === currentBlockId);
        block.currentContent = newHTML;

        // Re-aplicar modo edición (perderíamos selección si no lo hacemos, pero para guardar basta)
        makeEditable(container);
    }

    function cleanEditable(root) {
        const all = root.querySelectorAll('*');
        all.forEach(el => el.removeAttribute('data-editable'));
        const s = root.querySelector('.selected');
        if(s) s.classList.remove('selected');
    }

    // --- EXPORTACIÓN ---
    function exportFile() {
        if (detectedBlocks.length === 0) return;

        let newContent = originalFileContent;

        // Reemplazar cada bloque detectado en el contenido original
        detectedBlocks.forEach(block => {
            // Usamos el fullMatch para asegurar que reemplazamos el string correcto
            // Ojo: Si el contenido original contenía backticks escapados dentro, esto puede fallar, 
            // pero es el método más robusto sin un parser AST real.
            
            // Estrategia: Reemplazar la parte HTML dentro de la coincidencia regex original
            // Necesitamos reconstruir la asignación completa.
            
            // 1. Obtener el regex original de este bloque
            const parser = parsers.find(p => p.name === block.name);
            if(parser) {
                // Reconstruimos el string de reemplazo.
                // Si era: const loginHTML = `ANTIGUO`;
                // Ahora es: const loginHTML = `NUEVO`;
                
                // Regex split es más seguro para reconstruir estructura
                const match = newContent.match(parser.regex);
                if (match) {
                    const fullString = match[0]; // "const loginHTML = `ANTIGUO`;"
                    const prefix = fullString.substring(0, fullString.indexOf('`') + 1); // "const loginHTML = `"
                    const suffix = fullString.substring(fullString.lastIndexOf('`')); // "`;"
                    
                    const replacement = prefix + block.currentContent + suffix;
                    
                    // Reemplazo global (cuidado si hay duplicados, pero suele haber 1 solo)
                    newContent = newContent.replace(parser.regex, replacement);
                }
            }
        });

        // Descargar
        const blob = new Blob([newContent], { type: "text/javascript" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "drawers_modified.js";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        alert("Archivo exportado correctamente como 'drawers_modified.js'");
    }

</script>
</body>
</html>
